name: Build Animation Studio XR Stage 3 APK
on:
  push:
    branches: [main, feature/xray-side-by-side-stage1, feature/anatomical-planes-stage2, feature/head-weights-stage3]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Test keyframe editor and clips
        run: npm test
      - name: Compile Animation Studio
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Register native file save plugin
        run: |
          mkdir -p android/app/src/main/java/com/rayzeng/animationstudio/xrstage3
          sed 's/package com.rayzeng.animationstudio;/package com.rayzeng.animationstudio.xrstage3;/' branding/android/native/MainActivity.java > android/app/src/main/java/com/rayzeng/animationstudio/xrstage3/MainActivity.java
          sed 's/package com.rayzeng.animationstudio;/package com.rayzeng.animationstudio.xrstage3;/' branding/android/native/NativeFileSaverPlugin.java > android/app/src/main/java/com/rayzeng/animationstudio/xrstage3/NativeFileSaverPlugin.java
      - name: Apply custom neon Animation Studio launcher icon
        run: |
          # Replace Capacitor defaults on both Android 8+ adaptive and older launchers.
          mkdir -p android/app/src/main/res/drawable-nodpi
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cp branding/android/animation_icon.webp android/app/src/main/res/drawable-nodpi/animation_icon.webp
          cp branding/android/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp branding/android/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            rm -f "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            cp branding/android/animation_icon.webp "$dir/ic_launcher.webp"
            cp branding/android/animation_icon.webp "$dir/ic_launcher_round.webp"
          done
      - name: Sync web editor
        run: npx cap sync android
      - name: Assemble Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Animation-Studio-XR-Stage3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
