name: Build Animation Studio APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Test keyframe editor and clips
        run: npm test
      - name: Compile Animation Studio
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Register native file save plugin
        run: |
          mkdir -p android/app/src/main/java/com/rayzeng/animationstudio
          cp branding/android/native/MainActivity.java android/app/src/main/java/com/rayzeng/animationstudio/MainActivity.java
          cp branding/android/native/NativeFileSaverPlugin.java android/app/src/main/java/com/rayzeng/animationstudio/NativeFileSaverPlugin.java
      - name: Sync web editor
        run: npx cap sync android
      - name: Assemble Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Animation-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
